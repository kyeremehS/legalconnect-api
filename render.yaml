# Render Blueprint for LegalConnect API
# Dashboard: Blueprints -> New Blueprint Instance -> select repo.
# Auto-deploy stays on: every push to main redeploys.
# Set secrets (sync: false) in the Render dashboard, not here.
services:
  - type: web
    name: legalconnect-api
    runtime: node
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        value: legalconnect-bucket
