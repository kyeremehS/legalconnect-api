name: api-ci
on:
  push:
    paths:
      - 'legalconnect-api/**'
  pull_request:
    paths:
      - 'legalconnect-api/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: legalconnect-api/package-lock.json
      - run: npm ci
        working-directory: legalconnect-api
      - run: npx tsc --noEmit
        working-directory: legalconnect-api
